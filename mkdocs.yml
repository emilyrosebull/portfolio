site_name: Emily Bull — Technical Writer
site_description: Technical writing portfolio
site_url: https://emilybullportfolio.netlify.app

theme:
  name: material
  palette:
    scheme: default
    primary: teal
    accent: teal
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Portfolio: portfolio.md
  - About: about.md
  - Task It:
    - Overview: task-it/overview.md
    - Configuration guide: task-it/configuration-guide.md

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - md_in_html
